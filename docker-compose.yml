services:
  paper-trading:
    build:
      context: .
    environment:
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('node:http');const request=http.get({host:'127.0.0.1',port:process.env.PORT||3000,path:'/api/health'},response=>process.exit(response.statusCode===200?0:1));request.on('error',()=>process.exit(1));request.setTimeout(2000,()=>{request.destroy();process.exit(1)});
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
